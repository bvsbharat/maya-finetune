# Clara = right channel of stereo recording.wav (gwvs recorder)
runs_dir: "/Users/bbhavnasi/Desktop/GW-Apps/0.GWVA/Runs/agentic-fnol-waitlist-pro/simulation/runs"

data_dir: "data/jacqueline"
wavs_subdir: "wavs"
metadata_file: "metadata_final.json"

clara_description: >-
  Warm empathetic American adult female claims agent,
  calm mid pitch, unhurried realistic phone pacing,
  natural first-notice-of-loss delivery without brightness or laughter

sample_rate: 24000
target_lufs: -23.0
channel: right
min_clip_sec: 1.0
max_clip_sec: 14.0

model_id: "maya-research/maya1"
snac_id: "hubertsiuzdak/snac_24khz"
output_dir: "outputs/jacqueline-lora"

lora:
  # Gentler than first run (r=64/all-proj/4ep destroyed base quality)
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]

train:
  bf16: true
  load_in_4bit: false
  lr: 5.0e-5
  epochs: 6
  per_device_batch_size: 1
  grad_accum: 8
  warmup_ratio: 0.05
  logging_steps: 5
  save_steps: 25
  max_seq_len: 4096
  seed: 42

aws:
  region: us-east-1
  instance_type: g5.2xlarge
  volume_gb: 200
